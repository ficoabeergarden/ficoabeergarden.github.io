<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beer Club · Personal</title>
<meta name="theme-color" content="#17150f">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#17150f;--paper:#f6f3e9;--bg:#e9e5d9;--amber:#e8b246;--green:#2f5d34;--wood:#2e2116;--grass:#3f6b3a;--muted:rgba(23,21,15,.72);--line:rgba(23,21,15,.22)}
*{box-sizing:border-box}
body{margin:0;background:#d8d2c2;color:var(--ink);font-family:"DM Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}a:hover{color:#3d382c}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:40px}
h1,h2,h3{font-family:"Space Mono",ui-monospace,monospace;font-weight:700;letter-spacing:-.02em;text-transform:uppercase;margin:0}
p{margin:0;line-height:1.5}
.pad{padding:22px 20px}
.stack{display:grid;gap:14px}
.kick{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--green)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 20px;border-radius:12px;font:500 15px "DM Mono",monospace;letter-spacing:.02em;text-decoration:none;border:1px solid var(--ink);box-shadow:0 2px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-wood{background:var(--wood);color:#f7f2e6}
.btn-grass{background:var(--grass);color:#f4f7e8}
.btn-paper{background:var(--paper);color:var(--ink)}
.btn-sm{min-height:44px;width:auto;padding:0 14px;font-size:13px}
.link{background:none;border:0;padding:8px 0;font:500 13px "DM Mono",monospace;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.field{display:grid;gap:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.input{width:100%;min-height:54px;padding:0 14px;font:17px "DM Mono",monospace;background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--ink)}
.box{border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.err{background:#f3dccf;border:1px solid #8a2b12;color:#6d200c;padding:10px 12px;font-size:13px;line-height:1.4;border-radius:10px}
.ok{background:#dfe8d6;border:1px solid var(--green);padding:18px 16px;display:grid;gap:6px;border-radius:14px}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.topbar button{color:var(--paper);background:none;border:0;font:inherit;letter-spacing:inherit;cursor:pointer;padding:6px 0}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:8px 10px 10px;background:var(--ink);position:sticky;top:0;z-index:5}
.tabs button{position:relative;border:0;border-radius:12px;padding:10px 2px 8px;font:500 11px "DM Mono",monospace;background:transparent;color:rgba(246,243,233,.78);cursor:pointer;min-height:66px;display:grid;justify-items:center;align-content:center;gap:5px;text-align:center;transition:background-color .15s,color .15s}
.tabs button svg{width:24px;height:24px}
.tabs button strong{font:700 12px "Space Mono",monospace;letter-spacing:0;line-height:1.1}
.tabs button:hover{background:rgba(246,243,233,.08);color:var(--paper)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tabs .cnt{position:absolute;top:5px;right:calc(50% - 26px);min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--amber);color:var(--ink);font:700 11px/20px "Space Mono",monospace}
.guia{display:grid;gap:3px;padding:14px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.guia b{font:700 17px "Space Mono",monospace}
.guia span{font-size:13px;line-height:1.45;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.big{font-family:"Space Mono";font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em}
.list{display:grid}
.list>div{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.plus{color:var(--green);font-family:"Space Mono";font-weight:700}
.minus{color:#8a2b12;font-family:"Space Mono";font-weight:700}
#reader{width:100%;background:var(--ink);min-height:280px;border-radius:14px;overflow:hidden}
#reader video{object-fit:cover}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:60px;font:700 24px "Space Mono",monospace;background:var(--paper);border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink)}
.keys button:active{background:#fbefcf}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{padding:14px 16px;display:grid;gap:4px}
.stat b{font-family:"Space Mono";font-size:32px;line-height:1}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{min-height:48px;border:0;background:var(--paper);font:700 14px "Space Mono",monospace;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.evrow{width:100%;text-align:left;padding:14px 16px;display:grid;gap:8px;cursor:pointer;font:inherit;color:inherit}
.evrow strong{font-family:"Space Mono";font-size:18px;display:block}
.pill{display:inline-flex;padding:4px 9px;background:var(--amber);border:1px solid var(--ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ped{padding:14px 16px;display:grid;gap:10px}
.ped summary{list-style:none;cursor:pointer}
.ped summary::-webkit-details-marker{display:none}
.ref{font-family:"Space Mono";font-size:20px;letter-spacing:.1em}
.res{padding:22px 18px;display:grid;gap:6px;border:2px solid var(--ink);text-align:center}
.res-t{font-family:"Space Mono";font-weight:700;font-size:40px;line-height:1;text-transform:uppercase}
.res strong{font-family:"Space Mono";font-size:22px}
.res.good{background:#2f5d34;color:#f4f7e8}
.res.bad{background:#8a2b12;color:#fbe9e2}
.dotc{width:10px;height:10px;border-radius:50%;background:#8a2b12;flex:none}
.dotc.on{background:#2f5d34}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 76px 76px 32px;gap:6px;align-items:center}
.trow .input{min-height:48px;font-size:15px;padding:0 10px}
.warn{background:#fbefcf;border:1px solid #8a5a00;padding:10px 12px;font-size:13px;line-height:1.4}
textarea.input{padding:12px 14px;min-height:96px;resize:vertical;font-size:15px}
.foto{position:relative;display:grid;place-items:center;gap:6px;aspect-ratio:4/5;max-height:340px;width:100%;max-width:272px;border:1.5px dashed var(--muted);border-radius:14px;background:var(--paper);cursor:pointer;overflow:hidden;text-align:center;padding:16px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--muted)}
.foto:hover{border-color:var(--ink);color:var(--ink)}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto svg{width:32px;height:32px}
.thumb{width:56px;height:70px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const SB_URL = "https://jukpaqtriemqvxormrgb.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1a3BhcXRyaWVtcXZ4b3JtcmdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzODY1ODQsImV4cCI6MjEwNTk2MjU4NH0.4PPIVK2HvvgwrGEtNVn7CozqDCldvlFWnK2rpgrOmHE";
const sb = supabase.createClient(SB_URL, SB_KEY, { db: { schema: "beerclub" }, auth: { persistSession: true, storageKey: "bc_staff" } });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const errMsg = e => (e && e.message ? e.message : "Algo salió mal. Intenta otra vez.");
const NIV = { espuma: "Espuma ×1", lupulo: "Lúpulo ×1.25", barril: "Barril ×1.5" };
const MULT = { espuma: 1, lupulo: 1.25, barril: 1.5 };
let yo = null, tab = "sumar", scanner = null, sel = null, monto = "";

/* ─── Login ─── */
const DOM_STAFF = "@staff.ficoabeergarden.app";
const usuarioAEmail = v => { v = v.trim().toLowerCase(); return v.includes("@") ? v : v + DOM_STAFF; };
function viewLogin(msg) {
  app.innerHTML = `
  <div class="topbar"><span>Beer Club · Personal</span></div>
  <form class="pad stack" id="f" style="padding-top:36px">
    <span class="kick">Solo personal</span>
    <h1 style="font-size:36px;line-height:.95">Entrar</h1>
    <label class="field">Usuario<input class="input" name="email" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="carlos"></label>
    <label class="field">Clave<input class="input" name="pass" type="password" required autocomplete="current-password"></label>
    <div id="e">${msg ? `<div class="err">${esc(msg)}</div>` : ""}</div>
    <button class="btn btn-wood" id="ok">Entrar</button>
    <p class="small muted" style="text-align:center">¿No tienes usuario? Pídeselo a la dueña.</p>
  </form>`;
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, b = document.getElementById("ok");
    b.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: usuarioAEmail(f.email.value), password: f.pass.value });
    b.disabled = false;
    if (error) { document.getElementById("e").innerHTML = `<div class="err">Usuario o clave incorrectos.</div>`; return; }
    boot();
  };
}

async function boot() {
  app.innerHTML = `<div class="spin"></div>`;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return viewLogin();
  const { data: s, error: se } = await sb.from("staff").select("nombre,rol,activo").eq("auth_id", session.user.id).maybeSingle();
  if (se) {
    const c = JSON.parse(localStorage.getItem("bc_yo") || "null");
    if (c) { yo = c; tab = "eventos"; return shell(); }
    return viewLogin("Sin conexión. Conéctate una vez para entrar.");
  }
  if (s && s.activo) localStorage.setItem("bc_yo", JSON.stringify(s));
  if (!s || !s.activo) { await sb.auth.signOut(); localStorage.removeItem("bc_yo"); return viewLogin("Este usuario no tiene acceso. Pídele a la dueña que lo active."); }
  yo = s;
  tab = sessionStorage.getItem("bc_tab") || (yo.rol === "admin" ? "panel" : "sumar");
  if (tab === "panel" && yo.rol !== "admin") tab = "sumar";
  shell();
}

function shell() {
  const ic = {
    sumar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 17.5h7M17.5 14v7"/></svg>',
    canjear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8S10.5 3 8 4s0 4 4 4c4 0 6.5-3 4-4s-4 4-4 4"/></svg>',
    eventos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>',
    panel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
  };
  const tabs = [["sumar", "Puntos"], ["canjear", "Premios"], ["eventos", "Eventos"]].concat(yo.rol === "admin" ? [["panel", "Resumen"]] : []);
  const GUIA = {
    sumar: ["Sumar puntos", "Cuando un socio paga su cuenta. Escanea el QR de su tarjeta y escribe el total."],
    canjear: ["Entregar un premio", "Cuando el cliente te muestra un código de 6 números en su celular."],
    eventos: ["Eventos", "Confirmar transferencias de entradas y escanear en la puerta."],
    panel: ["Resumen del club", "Cuántos socios hay, quién no ha vuelto, últimos movimientos y tu equipo."]
  };
  app.innerHTML = `
  <div class="topbar"><span class="grow">Hola, ${esc(yo.nombre)}</span><button id="out">Salir</button></div>
  <nav class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-t="${k}">${ic[k]}<strong>${l}</strong>${k === "eventos" ? `<span class="cnt" id="cnt" hidden></span>` : ""}</button>`).join("")}</nav>
  <div class="guia"><b>${GUIA[tab][0]}</b><span>${GUIA[tab][1]}</span></div>
  <main id="view"></main>`;
  sb.rpc("eventos_staff").then(({ data }) => { const n = (data || []).reduce((s, e) => s + (+e.pendientes || 0), 0), c = document.getElementById("cnt"); if (c && n) { c.hidden = false; c.textContent = n; c.title = n + " pagos por confirmar"; } }).catch(() => {});
  document.getElementById("out").onclick = async () => { await stopScan(); await sb.auth.signOut(); sessionStorage.removeItem("bc_tab"); sessionStorage.removeItem("bc_ev"); localStorage.removeItem("bc_yo"); evSel = null; viewLogin(); };
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = async () => { await stopScan(); tab = b.dataset.t; sessionStorage.setItem("bc_tab", tab); shell(); });
  ({ sumar: viewScan, canjear: viewCanjear, eventos: viewEventos, panel: viewPanel })[tab]();
}
const V = () => document.getElementById("view");

/* ─── Sumar puntos ─── */
async function stopScan() { if (scanner) { try { await scanner.stop(); } catch (_) {} scanner = null; } }

function viewScan() {
  sel = null; monto = "";
  V().innerHTML = `
  <section class="pad stack">
    <span class="kick">Paso 1 de 2 · Escanea el QR del cliente</span>
    <div id="reader"></div>
    <div id="e"></div>
    <details><summary class="small" style="cursor:pointer">¿No lee? Escribe el código</summary>
      <form id="man" class="stack" style="margin-top:10px"><input class="input" name="c" placeholder="Código de la tarjeta" autocomplete="off"><button class="btn btn-paper">Buscar</button></form>
    </details>
  </section>`;
  document.getElementById("man").onsubmit = ev => { ev.preventDefault(); const v = ev.target.c.value.trim(); if (v) buscar(v); };
  startScanner(async txt => { await stopScan(); buscar(txt); });
}

function startScanner(onText) {
  scanner = new Html5Qrcode("reader", { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; } }, txt => onText(txt.trim()), () => {})
    .catch(() => { const e = document.getElementById("e"); if (e) e.innerHTML = `<div class="err">No se pudo abrir la cámara. Da permiso en el navegador.</div>`; });
}

async function buscar(qr) {
  if (/^BGE:/i.test(qr) || qr.includes("#q=")) { viewScan(); document.getElementById("e").innerHTML = `<div class="err">Esto es una entrada de evento. Escanéala en Eventos → Puerta.</div>`; return; }
  const token = (qr.includes("#t=") ? qr.split("#t=")[1] : qr).split(/[?&\s]/)[0].trim().toLowerCase();
  V().innerHTML = `<div class="spin"></div>`;
  const { data: c, error: qe } = await sb.from("clientes").select("id,nombre,qr_token").eq("qr_token", token).maybeSingle();
  if (qe) { viewScan(); document.getElementById("e").innerHTML = `<div class="err">Error al buscar: ${esc(qe.message)}</div>`; return; }
  if (!c) { viewScan(); document.getElementById("e").innerHTML = `<div class="err">QR no válido (${esc(token.slice(0, 8))}…).</div>`; return; }
  const { data: s } = await sb.from("saldos").select("puntos,nivel").eq("cliente_id", c.id).maybeSingle();
  sel = { ...c, ...(s || { puntos: 0, nivel: "espuma" }) };
  viewMonto();
}

function viewMonto() {
  const n = parseFloat(monto || "0"), pts = Math.floor(n * 10 * MULT[sel.nivel]);
  V().innerHTML = `
  <section class="pad stack">
    <div class="box row" style="padding:14px 16px">
      <div class="grow"><strong style="font-family:'Space Mono';font-size:20px;display:block">${esc(sel.nombre)}</strong><span class="small muted">${NIV[sel.nivel]} · ${sel.puntos} pts</span></div>
      <button class="link" id="otro">Cambiar</button>
    </div>
    <span class="kick">Paso 2 de 2 · Escribe el total de la cuenta</span>
    <div class="row" style="align-items:baseline"><span class="big grow">$${monto || "0"}</span><span class="plus" style="font-size:20px">+${pts} pts</span></div>
    <div class="keys">${["1","2","3","4","5","6","7","8","9",".","0","⌫"].map(k => `<button type="button" data-k="${k}">${k}</button>`).join("")}</div>
    <input class="input" id="tk" placeholder="N.º de ticket (opcional)" autocomplete="off">
    <div id="e"></div>
    <button class="btn btn-wood" id="ok" ${n > 0 ? "" : "disabled"}>Sumar ${pts} pts</button>
  </section>`;
  document.getElementById("otro").onclick = viewScan;
  V().querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k, tk = document.getElementById("tk").value;
    if (k === "⌫") monto = monto.slice(0, -1);
    else if (k === ".") { if (!monto.includes(".")) monto = (monto || "0") + "."; }
    else if (!/\.\d{2}$/.test(monto) && monto.length < 7) monto = monto === "0" ? k : monto + k;
    viewMonto(); document.getElementById("tk").value = tk;
  });
  document.getElementById("ok").onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true;
    const { data: r, error } = await sb.rpc("sumar_puntos", { p_qr: sel.qr_token, p_monto: n, p_ticket: document.getElementById("tk").value.trim() || null });
    if (error) { b.disabled = false; document.getElementById("e").innerHTML = `<div class="err">${esc(errMsg(error))}</div>`; return; }
    V().innerHTML = `
    <section class="pad stack" style="padding-top:34px">
      <div class="ok"><span class="kick">Listo</span><span class="big">+${r.puntos_sumados} pts</span><span>${esc(r.cliente)} · saldo ${r.saldo} pts · ${NIV[r.nivel]}</span></div>
      <p class="small muted">El cliente ya lo ve en su tarjeta.</p>
      <button class="btn btn-wood" id="sig">Siguiente cliente</button>
    </section>`;
    document.getElementById("sig").onclick = viewScan;
  };
}

/* ─── Canjear ─── */
function viewCanjear() {
  V().innerHTML = `
  <form class="pad stack" id="f">
    <span class="kick">Código de canje del cliente</span>
    <input class="input" name="c" inputmode="numeric" maxlength="6" pattern="\\d{6}" placeholder="000000" autocomplete="off" style="font-family:'Space Mono';font-size:40px;letter-spacing:.3em;text-align:center;min-height:80px" required>
    <div id="e"></div>
    <button class="btn btn-wood" id="ok">Confirmar canje</button>
    ${yo.rol === "admin" ? `<button type="button" class="btn btn-paper" id="edp" style="margin-top:18px">Editar premios y puntos</button>` : ""}
  </form>`;
  const edp = document.getElementById("edp"); if (edp) edp.onclick = viewPremios;
  const f = document.getElementById("f"); f.c.focus();
  f.onsubmit = async ev => {
    ev.preventDefault();
    const b = document.getElementById("ok"); b.disabled = true;
    const { data: r, error } = await sb.rpc("confirmar_canje", { p_codigo: f.c.value.trim() });
    b.disabled = false;
    if (error) { document.getElementById("e").innerHTML = `<div class="err">${esc(errMsg(error))}</div>`; return; }
    V().innerHTML = `
    <section class="pad stack" style="padding-top:34px">
      <div class="ok"><span class="kick">Entregar</span><span style="font-family:'Space Mono';font-weight:700;font-size:30px;line-height:1.05">${esc(r.recompensa)}</span><span>a ${esc(r.cliente)}</span></div>
      <button class="btn btn-wood" id="sig">Otro canje</button>
    </section>`;
    document.getElementById("sig").onclick = viewCanjear;
  };
}

/* ─── Premios (admin) ─── */
async function viewPremios() {
  V().innerHTML = `<div class="spin"></div>`;

      <span class="small muted" id="rd">Staff: suma puntos, entrega premios, confirma pagos y usa la puerta.</span>

  el.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { rol = b.dataset.r; el.querySelectorAll("[data-r]").forEach(x => x.setAttribute("aria-selected", x === b)); document.getElementById("rd").textContent = RD[rol]; });
  document.getElementById("nu").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, b = f.querySelector(".btn"), e = document.getElementById("ne"); b.disabled = true; e.innerHTML = "";

    const { error } = await sb.rpc("crear_staff", { p_nombre: nombre, p_usuario: usuario, p_clave: clave, p_rol: rol });

    const msg = `Hola ${nombre}, ya tienes acceso al panel de Beer Garden 🍺\n${location.href.split("#")[0]}\nUsuario: ${usuario}\nClave: ${clave}`;

const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } };

const KP = () => "bc_puerta_" + evSel.id;
async function comprimir(file) {
  try {
    const img = await createImageBitmap(file), k = Math.min(1, 1400 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/jpeg", .85));
  } catch (_) { return file; }
}
async function subirFoto(file) {
  const blob = await comprimir(file), path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
  const { error } = await sb.storage.from("eventos").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from("eventos").getPublicUrl(path).data.publicUrl;
}

function abrirEvento(e, sub) {
  evSel = { id: e.id, nombre: e.nombre, fecha: e.fecha, slug: e.slug, activo: e.activo, foto_url: e.foto_url };
  evSub = sub; sessionStorage.setItem("bc_ev", JSON.stringify(evSel)); sessionStorage.setItem("bc_evsub", sub);
  viewEvento();
}

function viewEvento() {
  V().innerHTML = `
  <section class="pad stack" style="gap:10px;padding-bottom:8px">
    <button class="link" id="atras" style="justify-self:start">← Eventos</button>
    <div class="row" style="align-items:flex-start">

  </section>
  <div id="sub"></div>`;
  document.getElementById("atras").onclick = async () => { await stopScan(); evSel = null; sessionStorage.removeItem("bc_ev"); viewEventos(); };

  (evSub === "pagos" ? viewPagos : viewPuerta)();
}

    const { error } = await sb.rpc("anular_pedido", { p_pedido: +b.dataset.x });
    if (error) { alert(errMsg(error)); return; }
    viewPagos();
  });
  S().querySelectorAll("[data-re]").forEach(b => b.onclick = async () => {
    if (!confirm("Se crea un QR nuevo y el anterior deja de servir al instante. ¿Seguir?")) return;
    const { data: r, error } = await sb.rpc("reemitir_entrada", { p_entrada: +b.dataset.re });
    if (error) { alert(errMsg(error)); return; }
    aviso = `<div class="ok"><span class="kick">QR reemitido</span><span>El anterior ya no sirve. Envíale el nuevo a ${esc(r.nombre)}.</span><a class="btn btn-grass btn-sm" style="width:100%" target="_blank" rel="noopener" href="https://wa.me/${r.telefono}?text=${encodeURIComponent(`Hola ${r.nombre}, te reemitimos una entrada para ${evSel.nombre}. El QR anterior ya no sirve. Tus entradas: ${AGENDA}#p=${r.token}`)}">Enviar por WhatsApp</a></div>`;
    viewPagos();
  });
  const act = document.getElementById("act");
  if (act) act.onclick = async () => {
    const on = evSel.activo === false;
    if (!confirm(on ? "¿Abrir otra vez la venta?" : "¿Cerrar la venta? El evento deja de aparecer en la agenda.")) return;
    const { error } = await sb.rpc("activar_evento", { p_evento: evSel.id, p_activo: on });
    if (error) { alert(errMsg(error)); return; }
    evSel.activo = on; sessionStorage.setItem("bc_ev", JSON.stringify(evSel)); viewPagos();
  };
}

/* Puerta */
function viewPuerta() {
  lock = false;
  S().innerHTML = `<section class="pad stack" style="padding-top:6px">
    <div class="box" id="est" style="padding:12px 14px;display:grid;gap:8px"></div>
    <div id="res"></div>
    <div id="reader"></div>
    <div id="e"></div>
    <details><summary class="small" style="cursor:pointer">¿No lee el QR? Buscar por nombre</summary>
      <div class="stack" style="margin-top:10px;gap:8px"><input class="input" id="bn" placeholder="Nombre del comprador" autocomplete="off"><div class="list" id="bl"></div></div>
    </details>
  </section>`;
  paintEstado();
  document.getElementById("bn").oninput = ev => {
    const q = ev.target.value.trim().toLowerCase(), L = lsGet(KP(), null), bl = document.getElementById("bl");
    if (!L) { bl.innerHTML = `<div class="small muted">Descarga la lista primero.</div>`; return; }
    bl.innerHTML = q.length < 2 ? "" : L.lista.filter(x => x.nombre.toLowerCase().includes(q)).slice(0, 12).map(x => `<div><span class="grow small"><strong>${esc(x.nombre)}</strong> · ${esc(x.tipo)} ${x.n}/${x.de}</span>${x.estado === "usada" ? `<span class="small muted">Entró ${fH(x.usado_en)}</span>` : `<button class="btn btn-wood btn-sm" data-c="${x.c}">Dejar pasar</button>`}</div>`).join("") || `<div class="small muted">Sin resultados.</div>`;
    bl.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { lock = true; try { scanner && scanner.pause(true); } catch (_) {} validar(b.dataset.c); });
  };
  startScanner(txt => { if (lock) return; lock = true; try { scanner.pause(true); } catch (_) {} leer(txt); });
  syncCola();
}

function paintEstado() {
  const el = document.getElementById("est"); if (!el || !evSel) return;
  const L = lsGet(KP(), null), cola = lsGet("bc_cola", []).filter(c => c.ev === evSel.id), cf = lsGet("bc_conflictos", []).filter(c => c.ev === evSel.id), on = navigator.onLine;
  el.innerHTML = `<div class="row"><span class="dotc ${on ? "on" : ""}"></span><strong class="grow">${on ? "Con conexión" : "Sin conexión"}</strong>${cola.length ? `<span class="pill">${cola.length} por sincronizar</span>` : ""}</div>
    <span class="small muted">${L ? `Lista guardada a las ${fH(L.at)} · ${L.lista.length} entradas · ${L.lista.filter(x => x.estado === "usada").length} adentro` : "Este teléfono aún no tiene la lista. Descárgala antes de abrir puertas."}</span>
    ${cf.length ? `<div class="warn">${cf.length} ${cf.length === 1 ? "entrada se usó" : "entradas se usaron"} dos veces mientras no había conexión: ${cf.map(c => esc(c.nombre || "?")).join(", ")}</div>` : ""}
    <button class="btn btn-paper btn-sm" id="dl" style="width:100%" ${on ? "" : "disabled"}>${L ? "Actualizar lista" : "Descargar lista del evento"}</button>`;
  document.getElementById("dl").onclick = descargarLista;
}

async function descargarLista() {
  const b = document.getElementById("dl"); if (b) { b.disabled = true; b.textContent = "Descargando…"; }
  await syncCola();
  const { data, error } = await sb.rpc("lista_puerta", { p_evento: evSel.id });
  if (error) { alert(errMsg(error)); paintEstado(); return; }
  lsSet(KP(), { ev: evSel, at: new Date().toISOString(), lista: data });
  paintEstado();
}

function leer(t) {
  let cod = null;
  if (/^BGE:/i.test(t)) cod = t.slice(4);
  else if (t.includes("#q=")) cod = t.split("#q=")[1];
  if (!cod) return resultado({ ok: false, motivo: t.includes("#t=") || /^[0-9a-f]{32}$/i.test(t) ? "club" : "no_existe" });
  validar(cod.split(/[?&\s]/)[0].toLowerCase());
}

async function validar(cod) {
  const L = lsGet(KP(), null);
  let r = null;
  if (navigator.onLine) {
    const { data, error } = await sb.rpc("validar_entrada", { p_codigo: cod, p_evento: evSel.id });
    if (!error) r = data; else if (!esRed(error)) r = { ok: false, motivo: "error", msg: errMsg(error) };
  }
  if (!r) r = validarLocal(cod, L);
  else if (L) { const x = L.lista.find(y => y.c === cod); if (x && (r.ok || r.motivo === "usada")) { x.estado = "usada"; x.usado_en = x.usado_en || r.usado_en || new Date().toISOString(); lsSet(KP(), L); } }
  resultado(r);
}

function validarLocal(cod, L) {
  if (!L) return { ok: false, motivo: "sin_lista" };
  const x = L.lista.find(y => y.c === cod);
  if (!x) return { ok: false, motivo: "no_lista" };
  if (x.estado === "usada") return { ok: false, motivo: "usada", ...x };
  x.estado = "usada"; x.usado_en = new Date().toISOString(); lsSet(KP(), L);
  const cola = lsGet("bc_cola", []); cola.push({ c: cod, ev: evSel.id, t: x.usado_en }); lsSet("bc_cola", cola);
  return { ok: true, offline: true, ...x };
}

function resultado(r) {
  const M = {
    usada: ["Ya entró", `Esta entrada se usó a las ${fH(r.usado_en)}`],
    no_existe: ["No válida", "Este QR no existe o fue reemitido"],
    no_lista: ["No está en la lista", "Puede ser falsa, reemitida o comprada después de descargar la lista. Actualiza la lista cuando haya conexión."],
    otro_evento: ["Otro evento", `Es una entrada de ${r.evento || "otro evento"}`],
    pendiente: ["Sin pagar", "El pago de esta entrada no está confirmado"],
    anulada: ["Anulada", "Esta entrada fue anulada"],
    club: ["QR del Beer Club", "Es el QR de puntos. Pídele la entrada del evento."],
    sin_lista: ["Sin lista", "No hay conexión y este teléfono no tiene la lista guardada"],
    error: ["Error", r.msg || ""]
  }[r.motivo] || ["No válida", ""];
  if (navigator.vibrate) navigator.vibrate(r.ok ? 80 : [200, 80, 200]);
  document.getElementById("res").innerHTML = (r.ok
    ? `<div class="res good"><span class="res-t">Adelante</span><strong>${esc(r.nombre)}</strong><span>${esc(r.tipo)} · ${r.n} de ${r.de}${r.offline ? " · sin conexión" : ""}</span></div>`
    : `<div class="res bad"><span class="res-t">${M[0]}</span>${r.nombre ? `<strong>${esc(r.nombre)}</strong>` : ""}<span>${esc(M[1])}</span></div>`)
    + `<button class="btn btn-wood" id="sig" style="margin-top:12px">Escanear siguiente</button>`;
  document.getElementById("sig").onclick = siguiente;
  paintEstado();
  if (r.ok) setTimeout(() => { if (document.getElementById("sig")) siguiente(); }, 2500);
}

function siguiente() {
  const res = document.getElementById("res"); if (res) res.innerHTML = "";
  lock = false; try { scanner && scanner.resume(); } catch (_) {}
}

async function syncCola() {
  if (syncing || !navigator.onLine) return;
  const cola = lsGet("bc_cola", []); if (!cola.length) return;
  syncing = true; const rest = [];
  for (const it of cola) {
    const { data, error } = await sb.rpc("validar_entrada", { p_codigo: it.c, p_evento: it.ev, p_cuando: it.t });
    if (error) { if (esRed(error)) rest.push(it); continue; }
    if (data && !data.ok && data.motivo === "usada" && data.usado_en && Math.abs(new Date(data.usado_en) - new Date(it.t)) > 2000) {
      const cf = lsGet("bc_conflictos", []); cf.push({ ...it, nombre: data.nombre, otra: data.usado_en }); lsSet("bc_conflictos", cf);
    }
  }
  lsSet("bc_cola", rest.concat(lsGet("bc_cola", []).slice(cola.length)));
  syncing = false; paintEstado();
}
setInterval(syncCola, 15000);
addEventListener("online", () => { paintEstado(); syncCola(); });
addEventListener("offline", paintEstado);

/* Nuevo evento (admin) */
function viewNuevoEvento() {
  const fila = (n = "", ph = "General") => `<div class="trow"><input class="input" data-f="nombre" placeholder="${ph}" value="${n}"><input class="input" data-f="precio" inputmode="decimal" placeholder="$"><input class="input" data-f="cupo" inputmode="numeric" placeholder="Cupo"><button type="button" class="link" data-del aria-label="Quitar">✕</button></div>`;
  V().innerHTML = `<form class="pad stack" id="f">
    <button type="button" class="link" id="atras" style="justify-self:start">← Eventos</button>
    <h2 style="font-size:28px">Nuevo evento</h2>
    <label class="field">Nombre<input class="input" name="nombre" required minlength="3"></label>
    <label class="field">Fecha y hora<input class="input" name="fecha" type="datetime-local" required></label>
    <label class="field">Descripción (opcional)<textarea class="input" name="desc" rows="3"></textarea></label>
    <div class="field">Foto del evento (opcional)
      <label class="foto" id="fbox">${ICO_FOTO}<span id="ftxt">Toca para subir el flyer</span><img id="fprev" alt="" hidden><input type="file" accept="image/*" id="ffile" hidden></label>
      <span class="small muted" style="text-transform:none;letter-spacing:0">Aparece en la agenda. Mejor vertical (4:5).</span>
    </div>
    <label class="field">Datos para transferir<textarea class="input" name="pago" rows="5" required placeholder="Banco, tipo y n.º de cuenta, titular, cédula">${esc(localStorage.getItem("bc_pago") || "")}</textarea></label>
    <span class="kick">Tipos de entrada</span>
    <div class="trow small muted" style="margin-bottom:-8px"><span>Nombre</span><span>Precio</span><span>Cupo</span><span></span></div>
    <div id="tipos" class="stack" style="gap:8px">${fila("", "General")}${fila("", "VIP")}</div>
    <button type="button" class="btn btn-paper btn-sm" id="add">+ Agregar tipo</button>
    <span class="small muted">Cupo vacío = sin límite.</span>
    <div id="e"></div>
    <button class="btn btn-wood" id="ok">Crear evento</button>
  </form>`;
  const T = document.getElementById("tipos");
  const bindDel = () => T.querySelectorAll("[data-del]").forEach(b => b.onclick = () => b.parentElement.remove());
  bindDel();
  document.getElementById("add").onclick = () => { T.insertAdjacentHTML("beforeend", fila("", "Tipo")); bindDel(); };
  document.getElementById("atras").onclick = viewEventos;
  const ff = document.getElementById("ffile");
  ff.onchange = () => { const f = ff.files[0], p = document.getElementById("fprev"); if (!f) return; p.src = URL.createObjectURL(f); p.hidden = false; };
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, b = document.getElementById("ok"), e = document.getElementById("e");
    const tipos = [...T.querySelectorAll(".trow")].map(r => ({ nombre: r.querySelector('[data-f="nombre"]').value.trim(), precio: parseFloat(r.querySelector('[data-f="precio"]').value.replace(",", ".")), cupo: r.querySelector('[data-f="cupo"]').value.trim() })).filter(t => t.nombre && !isNaN(t.precio));
    if (!tipos.length) { e.innerHTML = `<div class="err">Agrega al menos un tipo con nombre y precio.</div>`; return; }
    b.disabled = true; e.innerHTML = "";
    let foto = null;
    if (ff.files[0]) {
      b.textContent = "Subiendo foto…";
      try { foto = await subirFoto(ff.files[0]); } catch (er) { b.disabled = false; b.textContent = "Crear evento"; e.innerHTML = `<div class="err">No se pudo subir la foto: ${esc(errMsg(er))}</div>`; return; }
      b.textContent = "Crear evento";
    }
    const { data: slug, error } = await sb.rpc("crear_evento", { p_nombre: f.nombre.value, p_fecha: new Date(f.fecha.value).toISOString(), p_descripcion: f.desc.value, p_datos_pago: f.pago.value, p_tipos: tipos, p_foto: foto });
    b.disabled = false;
    if (error) { e.innerHTML = `<div class="err">${esc(errMsg(error))}</div>`; return; }
    localStorage.setItem("bc_pago", f.pago.value);
    const link = `${AGENDA}?e=${slug}`;
    V().innerHTML = `<section class="pad stack" style="padding-top:30px">
      <div class="ok"><span class="kick">Evento creado</span><span style="font-family:'Space Mono';font-weight:700;font-size:24px">${esc(f.nombre.value)}</span><span class="small" style="word-break:break-all">${esc(link)}</span></div>
      <a class="btn btn-grass" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("Entradas para " + f.nombre.value + " 🍺 " + link)}">Compartir enlace de venta</a>
      <button class="btn btn-paper" id="vol">Ver eventos</button></section>`;
    document.getElementById("vol").onclick = viewEventos;
  };
}

boot();
</script>
